    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Orbitron:wght@600;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Stamp the theme before first paint so light-mode readers never see a dark flash.
      try {
        var t = localStorage.getItem("mongli-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
